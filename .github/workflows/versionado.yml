# Versionado automático: en cada push a main calcula la versión (VERSIONADO.md),
# actualiza CHANGELOG.md y los archivos de versión, y crea el tag vX.Y.Z.
name: Versionado

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: versionado
  cancel-in-progress: false

jobs:
  version:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configurar autor del bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Calcular y publicar versión
        run: node scripts/release.mjs --push main package.json package-lock.json
